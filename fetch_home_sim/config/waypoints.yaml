# Named waypoints in the map frame (14m x 14m house, doorway at origin).
# Kitchen is north (y > 0.75); living room is south (y < -0.75).
waypoints:
  kitchen:
    x: 0.5
    y: 3.0
    yaw: 1.5708       # facing the island/banana
  living_room:
    x: 0.0
    y: -3.0
    yaw: -1.5708
  couch:
    x: -1.5
    y: -4.8
    yaw: -1.5708      # standing in front of the couch, facing it
  tv:
    x: 4.0
    y: -3.5
    yaw: 0.0
  armchair:
    x: 3.0
    y: -4.3
    yaw: -1.5708
  dining_table:
    x: -2.7
    y: -2.5
    yaw: 3.1416
  home:
    x: 0.0
    y: -1.5
    yaw: 1.5708       # near the doorway, facing the kitchen

objects:
  banana: kitchen
  apple: kitchen
  cup: kitchen
  bowl: kitchen
  spoon: kitchen
  fork: kitchen
  knife: kitchen
  newspaper: living_room
  remote: tv
  book: living_room
