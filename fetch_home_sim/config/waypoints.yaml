# Named waypoints in map frame. Kitchen is north (y > 0.75), living room south (y < -0.75).
waypoints:
  kitchen:
    x: 0.0
    y: 2.0
    yaw: 1.5708
  living_room:
    x: 0.0
    y: -3.0
    yaw: 1.5708
  couch:
    x: -1.5
    y: -5.0
    yaw: 1.5708
  tv:
    x: 2.0
    y: -3.5
    yaw: 0.0
  armchair:
    x: 2.0
    y: -5.0
    yaw: 1.5708
  dining_table:
    x: -2.5
    y: -2.5
    yaw: 0.0
  home:
    x: 0.0
    y: -1.5
    yaw: 1.5708

# Object → waypoint mapping for pick-up commands
objects:
  banana: kitchen
  apple: kitchen
  cup: kitchen
  bowl: kitchen
  spoon: kitchen
  fork: kitchen
  knife: kitchen
  newspaper: living_room
  remote: tv
  book: living_room

# Exploration tour for auto_mapper (living room first, then kitchen)
exploration:
  - { x:  0.0, y: -2.5, yaw:  0.0    }
  - { x: -2.0, y: -2.0, yaw:  3.1416 }
  - { x: -2.0, y: -4.5, yaw:  0.0    }
  - { x:  0.5, y: -4.5, yaw:  0.0    }
  - { x:  2.0, y: -3.5, yaw:  1.5708 }
  - { x:  0.0, y: -1.2, yaw:  1.5708 }
  - { x:  0.0, y:  2.0, yaw:  1.5708 }
  - { x: -2.5, y:  3.0, yaw:  1.5708 }
  - { x: -2.5, y:  5.5, yaw:  0.0    }
  - { x:  0.0, y:  5.5, yaw: -1.5708 }
  - { x:  2.0, y:  3.5, yaw: -1.5708 }
  - { x:  0.0, y: -1.5, yaw:  1.5708 }
